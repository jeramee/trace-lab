[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-lab"
version = "0.1.0a0"
description = "Adapter-aware evidence orchestration for instrumented research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Jeramee Oliver"}]
dependencies = []

[project.scripts]
trace-lab = "trace_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
